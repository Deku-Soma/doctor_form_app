<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Examination Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="mb-4 text-primary">Medical Examination Form</h2>
    
    <form method="POST">
        <!-- Personal Information -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">Personal Information</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Surname</label>
                    <input type="text" name="surname" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">ID Number</label>
                    <input type="text" name="id_number" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Employer</label>
                    <input type="text" name="employer" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Job Title</label>
                    <input type="text" name="job_title" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Examination Date</label>
                    <input type="date" name="exam_date" class="form-control">
                </div>
            </div>
        </div>

        <!-- Medical Tests -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">Medical Test Results</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Glucose</label>
                    <input type="number" step="0.1" name="glucose" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Cholesterol</label>
                    <input type="number" step="0.1" name="cholesterol" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Blood Pressure</label>
                    <input type="text" name="blood_pressure" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Weight (kg)</label>
                    <input type="number" name="weight" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Height (cm)</label>
                    <input type="number" name="height" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Audiometry</label>
                    <input type="text" name="audiometry" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Urine Analysis</label>
                    <input type="text" name="urine_analysis" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Lung Function</label>
                    <input type="text" name="lung_function" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Vision</label>
                    <select name="vision" class="form-select">
                        <option selected disabled>Select</option>
                        <option value="20/20">20/20</option>
                        <option value="Needs Glasses">Needs Glasses</option>
                        <option value="Blurred">Blurred</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Working at Heights</label>
                    <select name="working_at_heights" class="form-select">
                        <option selected disabled>Select</option>
                        <option value="Fit">Fit</option>
                        <option value="Unfit">Unfit</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Hot/Cold Environments Questionnaire</label>
                    <input type="text" name="environment_questionnaire" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Psycho-social Questionnaire</label>
                    <input type="text" name="psychosocial_questionnaire" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Musculoskeletal Questionnaire</label>
                    <input type="text" name="musculoskeletal_questionnaire" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Comments</label>
                    <textarea name="comments" rows="3" class="form-control"></textarea>
                </div>
            </div>
        </div>

        <!-- Submit -->
        <div class="text-end">
            <button type="submit" class="btn btn-success btn-lg">Generate PDF</button>
        </div>
    </form>
</div>
</body>
</html>
