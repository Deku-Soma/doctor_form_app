<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthCorp360 — Confined Spaces</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .q-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);gap:12px;font-size:var(--font-sm)}
    .q-row:last-child{border-bottom:none}
    .q-text{flex:1}
    .q-radios{display:flex;gap:12px;flex-shrink:0}
    .q-radios label{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:var(--font-sm);font-weight:400;min-height:unset;margin:0}
    .q-radios input{width:16px;min-height:unset;accent-color:var(--brand)}
  </style>
</head>
<body>
  <div id="offline-banner" role="alert">⚠️ Offline</div>
  <nav class="navbar">
    <a href="/home.html" class="navbar-brand">HealthCorp<span class="dot">360</span></a>
    <div class="navbar-actions"><a href="/home.html" class="btn btn-ghost btn-sm">← Dashboard</a></div>
  </nav>
  <main class="container page-content">
    <div class="page-header"><h1>Confined Spaces Questionnaire</h1></div>
    <div id="form-alert"></div>
    <form id="main-form" novalidate>
      <div class="form-section">
        <h3>Employee Details</h3>
        <div class="form-grid">
          <div class="field"><label for="full_name_surname">Full Name &amp; Surname</label><input id="full_name_surname" name="full_name_surname" type="text"></div>
          <div class="field"><label for="id_number">ID Number</label><input id="id_number" name="id_number" type="text"></div>
          <div class="field"><label for="company">Company</label><input id="company" name="company" type="text"></div>
          <div class="field"><label for="site_store">Site / Store</label><input id="site_store" name="site_store" type="text"></div>
          <div class="field"><label for="occupation">Occupation</label><input id="occupation" name="occupation" type="text"></div>
          <div class="field"><label for="date">Date</label><input id="date" name="date" type="date"></div>
        </div>
      </div>
      <div class="form-section" id="questions-wrapper"><h3>Questionnaire</h3><div id="questions-container"></div></div>
      <div class="form-section">
        <h3>Additional Comments</h3>
        <div class="field"><textarea id="additional_comments" name="additional_comments" rows="4"></textarea></div>
      </div>
      <div class="form-section">
        <h3>Signature</h3>
        <div class="field"><label for="signature_date">Date</label><input id="signature_date" name="signature_date" type="date"></div>
        <div class="signature-wrapper"><canvas id="sig-canvas"></canvas></div>
        <div class="signature-controls"><button type="button" class="btn btn-ghost btn-sm" id="clear-sig">Clear</button></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="approve-btn"><span class="spinner"></span><span class="btn-label">✅ Approve</span></button>
        <button type="button" class="btn btn-secondary" id="pending-btn">⏳ Needs Doctor Approval</button>
      </div>
    </form>
    <div id="success-panel" class="hidden mt-2">
      <div class="alert alert-success" id="success-msg"></div>
      <a id="view-pdf-btn" href="#" target="_blank" class="btn btn-secondary btn-sm mt-1">📄 View PDF</a>
    </div>
  </main>
  <script src="/static/app.js"></script><script src="/static/signature.js"></script>
  <script>
    const FORM_TYPE = 'confined_spaces_questionnaire';
    const SECTIONS = [
      {title:'1. Awareness of Confined Spaces', qs:[
        ['q1_confined_space_definition','Do you know what qualifies as a confined space?'],
        ['q1_assigned_before','Have you ever been assigned to work in a confined space?'],
        ['q1_understand_hazards','Do you understand the potential hazards?'],
        ['q1_trained_safety_procedures','Have you been trained in safety procedures?'],
      ]},
      {title:'2. Understanding of Hazards', qs:[
        ['q2_oxygen_deficiency','Oxygen deficiency'],
        ['q2_flammable_explosive','Flammable or explosive atmosphere'],
        ['q2_toxic_gases','Toxic or hazardous gases'],
        ['q2_physical_hazards','Physical hazards (machinery, electrical)'],
        ['q2_water_flooding','Water accumulation or flooding'],
        ['q2_temperature_extremes','Temperature extremes'],
        ['q2_limited_egress','Limited access or egress'],
      ]},
      {title:'3. Safety Measures', qs:[
        ['q3_emergency_evac_procedures','Familiar with emergency evacuation procedures?'],
        ['q3_entry_permit_location_sign','Know location of entry permit?'],
        ['q3_operate_ppe','Know how to operate PPE?'],
        ['q3_rescue_training','Received rescue training?'],
        ['q3_procedure_if_hazard','Know procedure if hazard encountered?'],
      ]},
      {title:'4. PPE and Monitoring', qs:[
        ['q4_air_monitoring_importance','Aware of air monitoring importance?'],
        ['q4_trained_gas_detection','Trained to use gas detection equipment?'],
        ['q4_wear_appropriate_ppe','Wear appropriate PPE?'],
      ]},
      {title:'5. Personal Health and Fitness', qs:[
        ['q5_medical_conditions_affect','Any medical conditions affecting ability?'],
        ['q5_health_monitoring_awareness','Aware of health monitoring procedures?'],
        ['q5_feel_fit','Feel physically fit for confined spaces?'],
      ]},
      {title:'6. Employee Acknowledgment', qs:[
        ['q6_understand_risks','Understand risks and importance of safety procedures?'],
        ['q6_comfortable_asking','Comfortable asking for assistance?'],
        ['q6_ack_follow_procedures','Acknowledge must follow safety procedures?'],
      ]},
    ];
    const ALL_KEYS = SECTIONS.flatMap(s => s.qs.map(q=>q[0]));

    let sigPad;
    document.addEventListener('DOMContentLoaded', async () => {
      if (!redirectIfNoSession()) return;
      sigPad = initSignaturePad('sig-canvas');
      document.getElementById('clear-sig').onclick = () => sigPad.clear();
      const today = new Date().toISOString().slice(0,10);
      document.getElementById('date').value = today;
      document.getElementById('signature_date').value = today;

      const container = document.getElementById('questions-container');
      SECTIONS.forEach(sec => {
        const h = document.createElement('h4');
        h.textContent = sec.title; h.style.margin='16px 0 8px';
        container.appendChild(h);
        sec.qs.forEach(([key,text]) => {
          const row = document.createElement('div');
          row.className = 'q-row';
          row.innerHTML = `<span class="q-text">${text}</span><span class="q-radios"><label><input type="radio" name="${key}" value="Yes"> Yes</label><label><input type="radio" name="${key}" value="No"> No</label></span>`;
          container.appendChild(row);
        });
      });

      const co = getSelectedCompany(), emp = getSelectedEmployee();
      if (co && emp) { try { const {autofill} = await apiFetch(`/forms/${FORM_TYPE}/autofill?company_id=${co.id}&employee_id=${emp.id}`); applyAutofill(document.getElementById('main-form'), autofill); } catch(e){} }
      document.getElementById('pending-btn').onclick = () => submitForm('pending');
    });
    document.getElementById('main-form').onsubmit = e => { e.preventDefault(); submitForm('approved'); };
    async function submitForm(status) {
      const btn = document.getElementById(status==='approved'?'approve-btn':'pending-btn');
      setButtonLoading(btn, true);
      const f = document.getElementById('main-form');
      const data = {
        full_name_surname: f.elements['full_name_surname'].value,
        id_number: f.elements['id_number'].value,
        company: f.elements['company'].value,
        site_store: f.elements['site_store'].value,
        occupation: f.elements['occupation'].value,
        date: f.elements['date'].value,
        additional_comments: f.elements['additional_comments'].value,
        signature_date: f.elements['signature_date'].value,
        employee_signature: sigPad ? sigPad.toBase64() : '',
      };
      ALL_KEYS.forEach(k => { const sel = f.querySelector(`input[name="${k}"]:checked`); data[k] = sel?sel.value:''; });
      data.q2_other_specify = f.elements['q2_other_specify']?.value||'';
      data.q5_medical_conditions_specify = f.elements['q5_medical_conditions_specify']?.value||'';

      const co = getSelectedCompany()||{}, emp = getSelectedEmployee()||{};
      try {
        const r = await apiFetch(`/forms/${FORM_TYPE}/submit`,{method:'POST',body:JSON.stringify({employee_id:emp.id||'',company_id:co.id||'',data,status,employee_data:emp,user_id:(getSession()||{}).id||null})});
        document.getElementById('success-msg').textContent = `✅ Saved (${status})! ID: ${r.submission_id||'—'}`;
        if(r.pdf_path) document.getElementById('view-pdf-btn').href=`/documents/pdf?path=${encodeURIComponent(r.pdf_path)}`;
        document.getElementById('success-panel').classList.remove('hidden');
      } catch(err) { showAlert(document.getElementById('form-alert'),'error',err.message); }
      finally { setButtonLoading(btn,false); }
    }
  </script>
</body>
</html>
